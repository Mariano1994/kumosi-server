
name: CI

on: 
  push:
    branches: [ main ]

jobs :
  build: 
    name: 'build and push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup node
      uses: actions/setup-node@v4
    - run: npm install -g pnpm
      with:
        node-version: 22
        cache: 'pnpm'
    - run: pnpm install

    


